# Broker de desenvolvimento local para os contratos MQTT v1 do piloto.
listener 1883 0.0.0.0
protocol mqtt

# A porta é publicada somente em 127.0.0.1 pelo Compose. Autenticação e ACLs
# serão adicionadas na issue #5.
allow_anonymous true

# Todos os contratos atuais usam QoS 1 e retain=false.
max_qos 1
retain_available false

persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 60

connection_messages true
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
sys_interval 10
