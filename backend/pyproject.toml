[project]
name = "evolver-cnpem-backend"
version = "0.1.0"
description = "API e ingestão do piloto simulado eVOLVER CNPEM"
requires-python = ">=3.12,<3.13"
dependencies = [
  "evolver-contracts",
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "paho-mqtt>=2,<3",
  "python-dotenv[cli]>=1,<2",
  "uvicorn>=0.30,<1",
]

[tool.uv.sources]
evolver-contracts = { workspace = true }

[dependency-groups]
dev = [
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires a disposable PostgreSQL + TimescaleDB database"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
