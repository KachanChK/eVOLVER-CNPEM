[project]
name = "evolver-cnpem-backend"
version = "0.1.0"
description = "Serviços externos do piloto simulado eVOLVER CNPEM"
requires-python = ">=3.12,<3.13"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
  "alembic>=1.14,<2",
  "jsonschema>=4.23,<5",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires a disposable PostgreSQL + TimescaleDB database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
