[project]
name = "evolver-cnpem-backend"
version = "0.1.0"
description = "API e ingestão do piloto simulado eVOLVER CNPEM"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiomqtt>=2.3,<3",
  "evolver-contracts",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]

[tool.uv.sources]
evolver-contracts = { workspace = true }

[dependency-groups]
dev = [
  "alembic>=1.14,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires a disposable TimescaleDB database (and Mosquitto for MQTT tests)",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
