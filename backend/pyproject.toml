[project]
name = "evolver-cnpem-backend"
version = "0.1.0"
description = "API e ingestão do piloto simulado eVOLVER CNPEM"
requires-python = ">=3.12,<3.13"
dependencies = ["evolver-contracts"]

[tool.uv.sources]
evolver-contracts = { workspace = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
