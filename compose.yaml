name: ${COMPOSE_PROJECT_NAME:-evolver-cnpem}

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    ports:
      - "${MQTT_BIND_HOST:-127.0.0.1}:${MQTT_PORT:-1883}:1883"
    environment:
      MQTT_HEALTH_PASSWORD: ${MQTT_HEALTH_PASSWORD:?defina no .env}
      MQTT_INGESTION_PASSWORD: ${MQTT_INGESTION_PASSWORD:?defina no .env}
      MQTT_API_PASSWORD: ${MQTT_API_PASSWORD:?defina no .env}
      MQTT_SIMULATOR_PASSWORD: ${MQTT_SIMULATOR_PASSWORD:?defina no .env}
    entrypoint: ["/bin/sh", "/mosquitto/config/docker-entrypoint.sh"]
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/acl:/mosquitto/config/acl:ro
      - ./infra/mosquitto/docker-entrypoint.sh:/mosquitto/config/docker-entrypoint.sh:ro
      - ./infra/mosquitto/smoke-test.sh:/mosquitto/config/smoke-test.sh:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mosquitto_pub -V mqttv5 -h 127.0.0.1 -p 1883 -t evolver/health
          -u evolver-health -P "$${MQTT_HEALTH_PASSWORD}" -m healthcheck -q 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - evolver_local

  timescaledb:
    image: timescale/timescaledb:2.31.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evolver}
      POSTGRES_USER: ${POSTGRES_USER:-evolver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evolver-local-only}
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" &&
          test "$$(psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc
          "SELECT 1 FROM pg_extension WHERE extname = 'timescaledb';")" = "1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - evolver_local

networks:
  evolver_local:
    driver: bridge

volumes:
  mosquitto_data:
  postgres_data:
