name: ${COMPOSE_PROJECT_NAME:-evolver-cnpem}

services:
  timescaledb:
    image: timescale/timescaledb:2.31.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evolver}
      POSTGRES_USER: ${POSTGRES_USER:-evolver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evolver-local-only}
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" &&
          test "$$(psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc
          "SELECT 1 FROM pg_extension WHERE extname = 'timescaledb';")" = "1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - evolver_local

networks:
  evolver_local:
    driver: bridge

volumes:
  postgres_data:
