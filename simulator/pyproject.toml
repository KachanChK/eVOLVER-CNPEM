[project]
name = "evolver-cnpem-simulator"
version = "0.1.0"
description = "Produtor externo de telemetria simulada do piloto eVOLVER CNPEM"
requires-python = ">=3.12,<3.13"
dependencies = [
  "evolver-contracts",
  "paho-mqtt>=2.1,<3",
  "pydantic-settings>=2.6,<3",
]

[tool.uv.sources]
evolver-contracts = { workspace = true }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
