name: CI - Validacao do backend

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Workspace Python (Ruff e pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter o codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar uv e Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'
          python-version: '3.12'

      - name: Instalar dependencias do lockfile
        run: uv sync --locked --all-packages --group dev

      - name: Verificar o codigo com Ruff
        run: >-
          uv run --locked --all-packages ruff check
          backend/src backend/migrations backend/tests simulator/src
          packages/contracts/src packages/contracts/tests

      - name: Executar testes e validar schemas
        run: uv run --locked --all-packages pytest packages/contracts/tests

      # Sem EVOLVER_TEST_DATABASE_URL e EVOLVER_TEST_MQTT_HOST os testes de integracao
      # sao ignorados; aqui rodam os testes unitarios da ingestao e do modelo.
      - name: Executar testes do backend
        working-directory: backend
        run: uv run --locked --all-packages pytest
